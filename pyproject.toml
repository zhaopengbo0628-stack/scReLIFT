[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screlift"
version = "0.1.0"
description = "Single-cell Regulatory Latent Information Fusion and Transfer for RNA-only Analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2",
  "torch>=2.4,<3", "threadpoolctl>=3.1"
]

[project.optional-dependencies]
analysis = ["anndata", "scanpy", "pandas", "h5py", "matplotlib", "seaborn", "joblib", "gseapy", "umap-learn", "statsmodels"]

[project.scripts]
screlift = "screlift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

